name: Translation
description: Fix a translation, or offer to translate the app into a new language.
title: "[i18n] "
labels: ["translation"]
body:
  - type: input
    id: lang
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change?
      description: Quote the current text and your suggestion, or tell us you'd like to translate a new language.
    validations:
      required: true
